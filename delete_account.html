<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funport - Delete Account Data</title>
  <style>
    :root {
      --bg: #0f1115;
      --bg2: #121722;
      --card: #171b22;
      --text: #e8edf3;
      --muted: #9aa6b2;
      --accent: #59c7ff;
      --border: #263041;
      --btn: #1c2330;
      --btn-active: #2a3a52;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .lang-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .lang-btn {
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
    }
    .lang-btn[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--btn-active);
      box-shadow: 0 0 0 1px rgba(89, 199, 255, 0.25) inset;
    }
    .page-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .page-link {
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      background: var(--btn);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 14px;
      line-height: 1;
    }
    .page-link.active {
      border-color: var(--accent);
      background: var(--btn-active);
      box-shadow: 0 0 0 1px rgba(89, 199, 255, 0.25) inset;
    }
    h1, h2 { color: var(--accent); }
    p, li { line-height: 1.55; }
    a { color: var(--accent); }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <nav id="langBar" class="lang-bar" aria-label="Language selector"></nav>
      <nav class="page-nav" aria-label="Page navigation">
        <a id="navHome" class="page-link" href="index.html"></a>
        <a id="navPrivacy" class="page-link" href="privacy.html"></a>
        <a id="navImpressum" class="page-link" href="impressum.html"></a>
        <a id="navEula" class="page-link" href="eula.html"></a>
        <a id="navDelete" class="page-link active" href="delete_account.html"></a>
      </nav>
      <article id="content"></article>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "funport_legal_lang";
    const LANGS = [
      { code: "de", label: "Deutsch", dir: "ltr" },
      { code: "en", label: "English", dir: "ltr" },
      { code: "es", label: "Español", dir: "ltr" },
      { code: "fr", label: "Français", dir: "ltr" },
      { code: "it", label: "Italiano", dir: "ltr" },
      { code: "pt", label: "Português", dir: "ltr" },
      { code: "ru", label: "Русский", dir: "ltr" },
      { code: "zh", label: "中文", dir: "ltr" },
      { code: "ja", label: "日本語", dir: "ltr" },
      { code: "ko", label: "한국어", dir: "ltr" },
      { code: "tr", label: "Türkçe", dir: "ltr" },
      { code: "ar", label: "العربية", dir: "rtl" }
    ];
    const DATA = {
      de: {
        title: "Daten loeschen",
        home: "Start",
        privacy: "Datenschutzerklaerung",
        impressum: "Impressum",
        eula: "EULA / Nutzungsbedingungen",
        del: "Daten loeschen",
        p1: "Nutzer koennen ihren Spielfortschritt direkt in der App unter Einstellungen -> Fortschritt loeschen entfernen.",
        p2: "Dabei werden gespeicherte Daten (Fortschritt, Statistiken, Achievements) in den verwendeten Backend-Diensten geloescht.",
        p3: "Alternativ kann die Loeschung per E-Mail angefordert werden: basi.onur@gmail.com. Bearbeitungszeit in der Regel innerhalb von 48 Stunden.",
        p4: "Gespeichert werden nur fuer Betrieb und Synchronisierung notwendige Daten (z. B. Konto-ID und Spielfortschritt)."
      },
      en: {
        title: "Delete Account Data",
        home: "Home",
        privacy: "Privacy Policy",
        impressum: "Legal Notice",
        eula: "EULA / Terms",
        del: "Delete Account Data",
        p1: "Users can delete their game progress directly in the app via Settings -> Delete Progress.",
        p2: "This removes stored data (progress, stats, achievements) from the backend services used by the game.",
        p3: "Alternatively, deletion can be requested by e-mail: basi.onur@gmail.com. Processing usually takes up to 48 hours.",
        p4: "Only data required for operation and synchronization is stored (for example account ID and game progress)."
      },
      tr: {
        title: "Veri Silme",
        home: "Ana Sayfa",
        privacy: "Gizlilik Politikasi",
        impressum: "Yasal Bildirim",
        eula: "EULA / Kullanim Kosullari",
        del: "Veri Silme",
        p1: "Kullanicilar oyun verilerini uygulama icinde Ayarlar -> Ilerlemeyi Sil adimiyla silebilir.",
        p2: "Bu islem, kayitli verileri (ilerleme, istatistikler, basarimlar) kullanilan arka uc servislerinden kaldirir.",
        p3: "Alternatif olarak basi.onur@gmail.com adresine e-posta gondererek silme talebi yapabilirsiniz. Islem suresi genelde 48 saate kadar surer.",
        p4: "Yalnizca calisma ve senkronizasyon icin gerekli veriler saklanir (or. hesap kimligi ve oyun ilerlemesi)."
      }
    };

    function preferredLang() {
      const q = new URLSearchParams(location.search).get("lang");
      if (q) return q.toLowerCase();
      const s = localStorage.getItem(STORAGE_KEY);
      if (s) return s.toLowerCase();
      return (navigator.language || "en").toLowerCase().split("-")[0];
    }

    function render(code) {
      const m = LANGS.find((l) => l.code === code) || LANGS[1];
      const t = DATA[code] || DATA.en;
      localStorage.setItem(STORAGE_KEY, code);
      document.documentElement.lang = code;
      document.documentElement.dir = m.dir;

      document.getElementById("content").innerHTML = `
        <h1>${t.title}</h1>
        <p>${t.p1}</p>
        <p>${t.p2}</p>
        <p>${t.p3}</p>
        <p>${t.p4}</p>
      `;
      document.getElementById("navHome").textContent = t.home || DATA.en.home;
      document.getElementById("navPrivacy").textContent = t.privacy || DATA.en.privacy;
      document.getElementById("navImpressum").textContent = t.impressum || DATA.en.impressum;
      document.getElementById("navEula").textContent = t.eula || DATA.en.eula;
      document.getElementById("navDelete").textContent = t.del || DATA.en.del;
      document.getElementById("navHome").href = `index.html?lang=${encodeURIComponent(code)}`;
      document.getElementById("navPrivacy").href = `privacy.html?lang=${encodeURIComponent(code)}`;
      document.getElementById("navImpressum").href = `impressum.html?lang=${encodeURIComponent(code)}`;
      document.getElementById("navEula").href = `eula.html?lang=${encodeURIComponent(code)}`;
      document.getElementById("navDelete").href = `delete_account.html?lang=${encodeURIComponent(code)}`;

      document.querySelectorAll(".lang-btn").forEach((b) => {
        b.setAttribute("aria-pressed", b.dataset.lang === code ? "true" : "false");
      });
    }

    function buildBar() {
      const bar = document.getElementById("langBar");
      for (const lang of LANGS) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "lang-btn";
        b.dataset.lang = lang.code;
        b.textContent = lang.label;
        b.addEventListener("click", () => render(lang.code));
        bar.appendChild(b);
      }
    }

    buildBar();
    render(preferredLang());
  </script>
</body>
</html>
