    :root {

    }
    html, body {
      margin: 0;

      background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    main {
      max-width: 960px;
      margin: 24px auto;
      padding: 0 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .lang-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      background: linear-gradient(180deg, rgba(23, 27, 34, 0.98), rgba(23, 27, 34, 0.95));
    }
    .lang-btn {
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .lang-btn[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--btn-active);
      box-shadow: 0 0 0 1px rgba(89, 199, 255, 0.25) inset;
    }
    .page-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .page-link {
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      background: var(--btn);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 14px;
      line-height: 1;
    }
    .page-link.active {
      border-color: var(--accent);
      background: var(--btn-active);
      box-shadow: 0 0 0 1px rgba(89, 199, 255, 0.25) inset;
    }
    h1, h2 {
      margin-top: 0;
      color: var(--accent);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }
    h2 {
      margin-top: 24px;
      font-size: 1.05rem;
    }
    p {
      line-height: 1.55;
      color: var(--text);
    }
    .muted {
      color: var(--muted);
      font-size: 0.95rem;
    }
    a {
      color: var(--accent);
    }
  </style>

    function getPreferredLanguage() {
      const params = new URLSearchParams(window.location.search);
      const queryLang = (params.get("lang") || "").toLowerCase();
      if (EULA[queryLang]) return queryLang;

      const stored = (localStorage.getItem(STORAGE_KEY) || "").toLowerCase();
      if (EULA[stored]) return stored;

      const browser = (navigator.language || "de").toLowerCase();
      const base = browser.split("-")[0];
      if (EULA[base]) return base;

      return "de";
    }

    function makeParagraphWithLink(text, linkLabel) {
      const p = document.createElement("p");
      const marker = "{{privacy_link}}";
      if (!text.includes(marker)) {
        p.textContent = text;
        return p;
      }
      const parts = text.split(marker);
      p.append(document.createTextNode(parts[0] || ""));
      const a = document.createElement("a");
      a.href = PRIVACY_URL;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = linkLabel;
      p.append(a);
      p.append(document.createTextNode(parts.slice(1).join(marker)));
      return p;
    }

    function renderLanguage(code) {
      const data = EULA[code] || EULA.de;
      const meta = LANGS.find((l) => l.code === code) || LANGS[0];

      document.documentElement.lang = code;
      document.documentElement.dir = meta.dir;
      localStorage.setItem(STORAGE_KEY, code);

      const root = document.getElementById("eulaContent");
      root.innerHTML = "";

      const h1 = document.createElement("h1");
      h1.textContent = data.title;
      root.appendChild(h1);

      const m = document.createElement("p");
      m.className = "muted";
      m.innerHTML = `${data.provider}: Funport<br>${data.effective}: ${data.date}`;
      root.appendChild(m);

      data.sections.forEach((section) => {
        const h2 = document.createElement("h2");
        h2.textContent = section.h;
        root.appendChild(h2);
        root.appendChild(makeParagraphWithLink(section.p, data.privacy_link));
      });
      const nav = NAV_LABELS[code] || NAV_LABELS.en;
      document.getElementById("navHome").textContent = nav.home;
      document.getElementById("navPrivacy").textContent = nav.privacy;
      document.getElementById("navImpressum").textContent = nav.impressum;
      document.getElementById("navEula").textContent = nav.eula;
      document.getElementById("navDelete").textContent = nav.del;
      document.getElementById("navHome").href = `index.html?lang=${encodeURIComponent(code)}`;
      document.getElementById("navPrivacy").href = `privacy.html?lang=${encodeURIComponent(code)}`;
      document.getElementById("navImpressum").href = `impressum.html?lang=${encodeURIComponent(code)}`;
      document.getElementById("navEula").href = `eula.html?lang=${encodeURIComponent(code)}`;
      document.getElementById("navDelete").href = `delete_account.html?lang=${encodeURIComponent(code)}`;

      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.setAttribute("aria-pressed", btn.dataset.lang === code ? "true" : "false");
      });
    }

    function buildLanguageBar() {
      const bar = document.getElementById("langBar");
      LANGS.forEach((lang) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "lang-btn";
        btn.dataset.lang = lang.code;
        btn.setAttribute("aria-label", lang.label);
        btn.title = lang.label;
        btn.textContent = lang.label;
        btn.addEventListener("click", () => renderLanguage(lang.code));
        bar.appendChild(btn);
      });
    }

    buildLanguageBar();
    renderLanguage(getPreferredLanguage());
  </script>
