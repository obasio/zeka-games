<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funport - Impressum</title>
  <style>
    :root {
      --bg: #0f1115;
      --bg2: #121722;
      --card: #171b22;
      --text: #e8edf3;
      --muted: #9aa6b2;
      --accent: #59c7ff;
      --border: #263041;
      --btn: #1c2330;
      --btn-active: #2a3a52;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    main {
      max-width: 960px;
      margin: 24px auto;
      padding: 0 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .lang-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .lang-btn {
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
    }
    .lang-btn[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--btn-active);
      box-shadow: 0 0 0 1px rgba(89, 199, 255, 0.25) inset;
    }
    .page-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .page-link {
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      background: var(--btn);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 14px;
      line-height: 1;
    }
    .page-link.active {
      border-color: var(--accent);
      background: var(--btn-active);
      box-shadow: 0 0 0 1px rgba(89, 199, 255, 0.25) inset;
    }
    h1, h2 {
      color: var(--accent);
      margin-bottom: 8px;
    }
    p {
      line-height: 1.55;
      margin-top: 8px;
    }
    .muted {
      color: var(--muted);
    }
    a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <nav id="langBar" class="lang-bar" aria-label="Language selector"></nav>
      <nav class="page-nav" aria-label="Page navigation">
        <a id="navHome" class="page-link" href="index.html"></a>
        <a id="navPrivacy" class="page-link" href="privacy.html"></a>
        <a id="navImpressum" class="page-link active" href="impressum.html"></a>
        <a id="navEula" class="page-link" href="eula.html"></a>
        <a id="navDelete" class="page-link" href="delete_account.html"></a>
      </nav>
      <article id="content"></article>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "funport_legal_lang";
    const LANGS = [
      { code: "de", label: "Deutsch", dir: "ltr" },
      { code: "en", label: "English", dir: "ltr" },
      { code: "es", label: "Español", dir: "ltr" },
      { code: "fr", label: "Français", dir: "ltr" },
      { code: "it", label: "Italiano", dir: "ltr" },
      { code: "pt", label: "Português", dir: "ltr" },
      { code: "ru", label: "Русский", dir: "ltr" },
      { code: "zh", label: "中文", dir: "ltr" },
      { code: "ja", label: "日本語", dir: "ltr" },
      { code: "ko", label: "한국어", dir: "ltr" },
      { code: "tr", label: "Türkçe", dir: "ltr" },
      { code: "ar", label: "العربية", dir: "rtl" }
    ];
    const DATA = {
      de: {
        title: "Impressum - Funport",
        home: "Start",
        privacy: "Datenschutzerklaerung",
        impressum: "Impressum",
        eula: "EULA / Nutzungsbedingungen",
        del: "Daten loeschen",
        owner: "Angaben gemaess § 5 TMG",
        contact: "Onur Basibüyük - Funport<br>Rheine, Deutschland<br>E-Mail: <a href=\"mailto:basi.onur@gmail.com\">basi.onur@gmail.com</a>",
        d1h: "Haftungsausschluss",
        d1: "Alle Inhalte wurden mit groesster Sorgfalt erstellt. Fuer Richtigkeit, Vollstaendigkeit und Aktualitaet wird keine Gewaehr uebernommen. Externe Links liegen in der Verantwortung der jeweiligen Betreiber.",
        d2h: "Urheberrecht",
        d2: "Inhalte und Werke auf diesen Seiten unterliegen dem Urheberrecht. Vervielfaeltigung oder Verbreitung ausserhalb gesetzlicher Grenzen bedarf der schriftlichen Zustimmung.",
        foot: "Letzte Aktualisierung: Maerz 2026"
      },
      en: {
        title: "Legal Notice - Funport",
        home: "Home",
        privacy: "Privacy Policy",
        impressum: "Legal Notice",
        eula: "EULA / Terms",
        del: "Delete Account Data",
        owner: "Information according to § 5 TMG (Germany)",
        contact: "Onur Basibüyük - Funport<br>Rheine, Germany<br>E-mail: <a href=\"mailto:basi.onur@gmail.com\">basi.onur@gmail.com</a>",
        d1h: "Disclaimer",
        d1: "All content was created with great care. No warranty is given for correctness, completeness, or timeliness. External links are the responsibility of their respective operators.",
        d2h: "Copyright",
        d2: "Content on these pages is subject to copyright. Reproduction or distribution beyond legal limits requires prior written permission.",
        foot: "Last updated: March 2026"
      },
      tr: {
        title: "Yasal Bildirim - Funport",
        home: "Ana Sayfa",
        privacy: "Gizlilik Politikasi",
        impressum: "Yasal Bildirim",
        eula: "EULA / Kullanim Kosullari",
        del: "Veri Silme",
        owner: "Alman Telemedya Yasasi § 5 TMG'ye gore bilgi",
        contact: "Onur Basibüyük - Funport<br>Rheine, Almanya<br>E-posta: <a href=\"mailto:basi.onur@gmail.com\">basi.onur@gmail.com</a>",
        d1h: "Sorumluluk Reddi",
        d1: "Tum icerikler buyuk ozenle hazirlanmistir. Dogruluk, eksiksizlik veya guncellik icin garanti verilmez. Harici baglantilar ilgili site isleticilerinin sorumlulugundadir.",
        d2h: "Telif Hakki",
        d2: "Bu sayfadaki icerikler telif hakkina tabidir. Yasal sinirlar disinda kopyalama veya dagitim icin yazili izin gerekir.",
        foot: "Son guncelleme: Mart 2026"
      }
    };

    function preferredLang() {
      const q = new URLSearchParams(location.search).get("lang");
      if (q) return q.toLowerCase();
      const s = localStorage.getItem(STORAGE_KEY);
      if (s) return s.toLowerCase();
      return (navigator.language || "en").toLowerCase().split("-")[0];
    }

    function render(code) {
      const m = LANGS.find((l) => l.code === code) || LANGS[1];
      const t = DATA[code] || DATA.en;
      localStorage.setItem(STORAGE_KEY, code);
      document.documentElement.lang = code;
      document.documentElement.dir = m.dir;

      document.getElementById("content").innerHTML = `
        <h1>${t.title}</h1>
        <p><strong>${t.owner}</strong><br>${t.contact}</p>
        <h2>${t.d1h}</h2>
        <p>${t.d1}</p>
        <h2>${t.d2h}</h2>
        <p>${t.d2}</p>
        <p class="muted">${t.foot}</p>
      `;
      document.getElementById("navHome").textContent = t.home || DATA.en.home;
      document.getElementById("navPrivacy").textContent = t.privacy || DATA.en.privacy;
      document.getElementById("navImpressum").textContent = t.impressum || DATA.en.impressum;
      document.getElementById("navEula").textContent = t.eula || DATA.en.eula;
      document.getElementById("navDelete").textContent = t.del || DATA.en.del;
      document.getElementById("navHome").href = `index.html?lang=${encodeURIComponent(code)}`;
      document.getElementById("navPrivacy").href = `privacy.html?lang=${encodeURIComponent(code)}`;
      document.getElementById("navImpressum").href = `impressum.html?lang=${encodeURIComponent(code)}`;
      document.getElementById("navEula").href = `eula.html?lang=${encodeURIComponent(code)}`;
      document.getElementById("navDelete").href = `delete_account.html?lang=${encodeURIComponent(code)}`;

      document.querySelectorAll(".lang-btn").forEach((b) => {
        b.setAttribute("aria-pressed", b.dataset.lang === code ? "true" : "false");
      });
    }

    function buildBar() {
      const bar = document.getElementById("langBar");
      for (const lang of LANGS) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "lang-btn";
        b.dataset.lang = lang.code;
        b.textContent = lang.label;
        b.addEventListener("click", () => render(lang.code));
        bar.appendChild(b);
      }
    }

    buildBar();
    render(preferredLang());
  </script>
</body>
</html>
