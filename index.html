<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Funport - Legal Center</title>
  <style>
    :root {
      --bg: #0f1115;
      --bg2: #121722;
      --card: #171b22;
      --text: #e8edf3;
      --muted: #9aa6b2;
      --accent: #59c7ff;
      --border: #263041;
      --btn: #1c2330;
      --btn-active: #2a3a52;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, var(--bg), var(--bg2));
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .lang-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .lang-btn {
      border: 1px solid var(--border);
      background: var(--btn);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
    }
    .lang-btn[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--btn-active);
      box-shadow: 0 0 0 1px rgba(89, 199, 255, 0.25) inset;
    }
    .page-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .page-link {
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      background: var(--btn);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 14px;
      line-height: 1;
    }
    .page-link.active {
      border-color: var(--accent);
      background: var(--btn-active);
      box-shadow: 0 0 0 1px rgba(89, 199, 255, 0.25) inset;
    }
    h1 {
      margin: 8px 0 4px;
      color: var(--accent);
    }
    .muted {
      color: var(--muted);
      margin-top: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin-top: 20px;
    }
    .link-btn {
      display: block;
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      background: var(--btn);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .link-btn:hover {
      border-color: var(--accent);
      background: var(--btn-active);
    }
    footer {
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <nav id="langBar" class="lang-bar" aria-label="Language selector"></nav>
      <nav class="page-nav" aria-label="Page navigation">
        <a id="navHome" class="page-link active" href="index.html"></a>
        <a id="navPrivacy" class="page-link" href="privacy.html"></a>
        <a id="navImpressum" class="page-link" href="impressum.html"></a>
        <a id="navEula" class="page-link" href="eula.html"></a>
        <a id="navDelete" class="page-link" href="delete_account.html"></a>
      </nav>
      <h1 id="title"></h1>
      <p id="subtitle" class="muted"></p>
      <div class="grid">
        <a id="privacy" class="link-btn" href="privacy.html"></a>
        <a id="impressum" class="link-btn" href="impressum.html"></a>
        <a id="eula" class="link-btn" href="eula.html"></a>
        <a id="delete" class="link-btn" href="delete_account.html"></a>
      </div>
      <footer id="footer"></footer>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "funport_legal_lang";
    const LANGS = [
      { code: "de", label: "Deutsch", dir: "ltr" },
      { code: "en", label: "English", dir: "ltr" },
      { code: "es", label: "Español", dir: "ltr" },
      { code: "fr", label: "Français", dir: "ltr" },
      { code: "it", label: "Italiano", dir: "ltr" },
      { code: "pt", label: "Português", dir: "ltr" },
      { code: "ru", label: "Русский", dir: "ltr" },
      { code: "zh", label: "中文", dir: "ltr" },
      { code: "ja", label: "日本語", dir: "ltr" },
      { code: "ko", label: "한국어", dir: "ltr" },
      { code: "tr", label: "Türkçe", dir: "ltr" },
      { code: "ar", label: "العربية", dir: "rtl" }
    ];
    const I18N = {
      de: {
        title: "Funport - Rechtliche Informationen",
        subtitle: "Zentrale Seite fuer Datenschutz, Impressum, EULA und Datenloeschung.",
        home: "Start",
        privacy: "Datenschutzerklaerung",
        impressum: "Impressum",
        eula: "EULA / Nutzungsbedingungen",
        del: "Daten loeschen",
        footer: "Letzte Aktualisierung: Maerz 2026"
      },
      en: {
        title: "Funport - Legal Information",
        subtitle: "Central page for privacy policy, legal notice, EULA, and account deletion.",
        home: "Home",
        privacy: "Privacy Policy",
        impressum: "Legal Notice",
        eula: "EULA / Terms",
        del: "Delete Account Data",
        footer: "Last updated: March 2026"
      },
      tr: {
        title: "Funport - Yasal Bilgilendirme",
        subtitle: "Gizlilik, yasal bildirim, EULA ve veri silme icin merkez sayfa.",
        home: "Ana Sayfa",
        privacy: "Gizlilik Politikasi",
        impressum: "Yasal Bildirim",
        eula: "EULA / Kullanim Kosullari",
        del: "Hesap Verilerini Sil",
        footer: "Son guncelleme: Mart 2026"
      }
    };

    function preferredLang() {
      const q = new URLSearchParams(location.search).get("lang");
      if (q) return q.toLowerCase();
      const s = localStorage.getItem(STORAGE_KEY);
      if (s) return s.toLowerCase();
      return (navigator.language || "en").toLowerCase().split("-")[0];
    }

    function render(code) {
      const meta = LANGS.find((l) => l.code === code) || LANGS[1];
      const t = I18N[code] || I18N.en;
      localStorage.setItem(STORAGE_KEY, code);
      document.documentElement.lang = code;
      document.documentElement.dir = meta.dir;

      document.getElementById("title").textContent = t.title;
      document.getElementById("subtitle").textContent = t.subtitle;
      document.getElementById("privacy").textContent = t.privacy;
      document.getElementById("impressum").textContent = t.impressum;
      document.getElementById("eula").textContent = t.eula;
      document.getElementById("delete").textContent = t.del;
      document.getElementById("footer").textContent = t.footer;
      document.getElementById("navHome").textContent = t.home || I18N.en.home;
      document.getElementById("navPrivacy").textContent = t.privacy || I18N.en.privacy;
      document.getElementById("navImpressum").textContent = t.impressum || I18N.en.impressum;
      document.getElementById("navEula").textContent = t.eula || I18N.en.eula;
      document.getElementById("navDelete").textContent = t.del || I18N.en.del;
      document.getElementById("navHome").href = `index.html?lang=${encodeURIComponent(code)}`;
      document.getElementById("navPrivacy").href = `privacy.html?lang=${encodeURIComponent(code)}`;
      document.getElementById("navImpressum").href = `impressum.html?lang=${encodeURIComponent(code)}`;
      document.getElementById("navEula").href = `eula.html?lang=${encodeURIComponent(code)}`;
      document.getElementById("navDelete").href = `delete_account.html?lang=${encodeURIComponent(code)}`;

      document.querySelectorAll(".lang-btn").forEach((b) => {
        b.setAttribute("aria-pressed", b.dataset.lang === code ? "true" : "false");
      });
    }

    function buildBar() {
      const bar = document.getElementById("langBar");
      for (const lang of LANGS) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "lang-btn";
        b.dataset.lang = lang.code;
        b.textContent = lang.label;
        b.addEventListener("click", () => render(lang.code));
        bar.appendChild(b);
      }
    }

    buildBar();
    render(preferredLang());
  </script>
</body>
</html>
